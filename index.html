<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pump.fun — the token launchpad</title>
  <meta name="description" content="Create and trade tokens instantly on Solana. Bonding curve pricing, fair launches, no presales.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟢</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="board">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true" focusable="false">
          <circle cx="18" cy="18" r="16" fill="url(#lg)" />
          <path d="M12 24 L18 8 L24 24 L18 19 Z" fill="#0e0e16" />
          <defs><linearGradient id="lg" x1="0" y1="0" x2="36" y2="36"><stop offset="0%" stop-color="#7bff69"/><stop offset="100%" stop-color="#00d4ff"/></linearGradient></defs>
        </svg>
        <span>pump<span class="logo-accent">.fun</span></span>
        <span class="logo-crown" aria-hidden="true">👑</span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="index.html" class="nav-link" aria-current="page">Board</a>
        <a href="create.html" class="nav-link">Create</a>
        <a href="token.html" class="nav-link">Trade</a>
        <a href="profile.html" class="nav-link">Profile</a>
      </nav>

      <div class="header-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" placeholder="Search tokens..." aria-label="Search tokens">
      </div>

      <button type="button" class="btn-wallet" data-demo="Demo only: wallet connection is not part of this template.">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><circle cx="18" cy="16" r="1"/></svg>
        <span class="btn-wallet-label">Connect Wallet</span>
      </button>

      <button type="button" class="mobile-toggle" id="mobileToggle" aria-label="Menu" aria-expanded="false" aria-controls="mobileNav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile">
    <a href="index.html" aria-current="page"><span aria-hidden="true">🏠</span> Board</a>
    <a href="create.html"><span aria-hidden="true">🪙</span> Create Token</a>
    <a href="token.html"><span aria-hidden="true">📈</span> Trade</a>
    <a href="profile.html"><span aria-hidden="true">👤</span> Profile</a>
  </nav>

  <!-- ========== MAIN ========== -->
  <main class="main" id="main" tabindex="-1">

    <section class="ticker-bar" id="ticker" aria-label="Recent activity (mock data)">
      <div class="ticker-track" id="tickerTrack"></div>
      <button type="button" class="ticker-toggle" id="tickerToggle" aria-pressed="false">Pause</button>
    </section>

    <div class="container">
      <h1 class="sr-only">Token board</h1>

      <div class="king-banner fade-in">
        <div class="king-banner-img grad-violet" aria-hidden="true">🐸</div>
        <div class="king-banner-info">
          <div class="king-banner-label">👑 King of the Hill</div>
          <h2 class="king-banner-name">PEPE2025 <span class="king-banner-ticker">$PEPE25</span></h2>
          <div class="king-banner-stats">
            <span>Market cap: <strong class="green">$847K</strong></span>
            <span>24h vol: <strong>$2.1M</strong></span>
            <span>Holders: <strong>4,821</strong></span>
            <span><span class="live-dot" aria-hidden="true"></span> <strong class="green">+342%</strong></span>
          </div>
        </div>
      </div>

      <h2 class="sr-only">Tokens</h2>
      <div class="tab-bar">
        <div class="tab-group" id="boardTabs" role="group" aria-label="Board view">
          <button type="button" class="tab" aria-pressed="true"><span class="tab-emoji" aria-hidden="true">🖥️</span> Terminal</button>
          <button type="button" class="tab" aria-pressed="false"><span class="tab-emoji" aria-hidden="true">🔥</span> Trending</button>
          <button type="button" class="tab" aria-pressed="false"><span class="tab-emoji" aria-hidden="true">🏆</span> Top</button>
          <button type="button" class="tab" aria-pressed="false"><span class="tab-emoji" aria-hidden="true">✨</span> New</button>
          <button type="button" class="tab" aria-pressed="false"><span class="tab-emoji" aria-hidden="true">🎓</span> About to Graduate</button>
          <button type="button" class="tab" aria-pressed="false"><span class="tab-emoji" aria-hidden="true">🚀</span> Graduated</button>
        </div>
        <div class="filter-group">
          <button type="button" class="filter-btn" data-demo="Demo only: filters are not implemented in this template.">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
            Filters
          </button>
          <button type="button" class="filter-btn" data-demo="Demo only: sorting is not implemented in this template.">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M3 6h18M6 12h12M9 18h6"/></svg>
            Sort
          </button>
        </div>
      </div>

      <div class="token-grid" id="tokenGrid"></div>

      <div class="load-more">
        <button type="button" class="btn btn-outline" id="loadMore">Load More</button>
      </div>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="#">Docs</a>
        <a href="#">GitHub</a>
        <a href="#">Twitter</a>
        <a href="#">Telegram</a>
        <a href="#">Discord</a>
        <a href="#">Support</a>
      </div>
      <div class="footer-copy">© 2025 pump.fun — built on Solana</div>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
